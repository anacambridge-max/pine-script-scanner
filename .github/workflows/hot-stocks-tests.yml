name: Hot Stocks Regression Tests

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/hot-stocks-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "worker/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/hot-stocks-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install pytest requests
      - run: python -m compileall -q worker tests
      - run: python -m pytest -q tests/test_hot_news_core.py tests/test_moneycontrol_news.py
